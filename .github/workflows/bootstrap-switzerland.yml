name: Bootstrap Switzerland rules

on:
  push:
    paths:
      - "src/switzerland_rules_patch.py"
      - ".github/workflows/bootstrap-switzerland.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply Switzerland rules
        run: python src/switzerland_rules_patch.py

      - name: Commit Switzerland rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm src/switzerland_rules_patch.py .github/workflows/bootstrap-switzerland.yml
          git add src/calendar_generator.py src/country_feeds.py
          git diff --cached --quiet && exit 0
          git commit -m "Add Switzerland HGV restriction rules"
          git push origin HEAD:main
