name: Apply Croatia special holiday rules

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-croatia-holiday-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  fix-and-rerun:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Croatia special holiday rules
        run: python src/croatia_rules_patch.py

      - name: Commit generator fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/calendar_generator.py
          git commit -m "Encode Croatian special holiday restrictions" || echo "No source changes to commit"
          git push

      - name: Re-run calendar Action
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Update TruckBAN Calendar" --ref main
