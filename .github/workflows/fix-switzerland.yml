name: Fix Switzerland event window

on:
  push:
    paths:
      - "src/switzerland_fix.py"
      - ".github/workflows/fix-switzerland.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply fix
        run: python src/switzerland_fix.py
      - name: Commit and remove bootstrap files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm src/switzerland_fix.py .github/workflows/fix-switzerland.yml
          git add src/calendar_generator.py
          git commit -m "Correct Switzerland HGV restriction window"
          git push origin HEAD:main
