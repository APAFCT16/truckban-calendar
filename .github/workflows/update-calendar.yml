name: Update TruckBAN Calendar
# Croatia is already implemented in the generator; this run promotes its country feed with explicit validation.

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check holidays
      - name: Fix calendar generator runtime clock
        run: |
          sed -i 's/if b <= NOW: return/if b <= datetime.now(timezone.utc): return/' src/calendar_generator.py
      - name: Apply verified France priority rules
        run: python src/priority_rules_patch.py
      - name: Apply verified country-specific rules
        run: python src/country_rules_patch.py
      - name: Apply verified Bulgaria rules
        run: python src/bulgaria_rules_patch.py
      - name: Apply verified Serbia baseline
        run: python src/serbia_rules_patch.py
      - name: Apply verified Portugal rules
        run: python src/portugal_rules_patch.py
      - name: Apply Spain country baseline
        run: python src/spain_rules_patch.py
      - name: Apply Spain N-230 Sunday rule
        run: python src/spain_n230_sunday_patch.py
      - name: Apply verified Slovenia rules
        run: python src/slovenia_rules_patch.py
      - name: Generate calendar
        run: python src/calendar_generator.py
      - name: Generate country feeds
        run: python src/country_feeds.py
      - name: Remove redundant Poland 15 August 2027 summer-Sunday event
        run: python src/poland_feed_cleanup.py
      - name: Make ICS feeds compatible with Classic Outlook
        run: python src/outlook_ics_compat.py
      - name: Validate Poland feed
        run: python src/validate_poland_feed.py
      - name: Validate Serbia feed
        run: python src/validate_serbia_feed.py
      - name: Diagnose generated Portugal feed
        run: |
          echo '--- Portugal VCI event(s) ---'
          awk 'BEGIN{RS="END:VEVENT"} /Porto VCI/{print $0 "END:VEVENT"}' public/countries/Portugal.ics || true
          echo '--- Portugal 15 September 2026 lines ---'
          grep -n "20260915" public/countries/Portugal.ics || true
      - name: Validate calendar feeds
        run: |
          set -x
          test -s public/truckban.ics
          grep -q "BEGIN:VCALENDAR" public/truckban.ics
          grep -q "END:VCALENDAR" public/truckban.ics
          test -s public/countries/France.ics
          test -s public/countries/Germany.ics
          test -s public/countries/Italy.ics
          test -s public/countries/Czech_Republic.ics
          test -s public/countries/Belgium.ics
          test -s public/countries/Luxembourg.ics
          test -s public/countries/Poland.ics
          test -s public/countries/Portugal.ics
          test -s public/countries/Romania.ics
          test -s public/countries/Serbia.ics
          test -s public/countries/Spain.ics
          test -s public/countries/Bulgaria.ics
          test -s public/countries/Croatia.ics
          test -s public/countries/Slovenia.ics
          grep -q "X-WR-CALNAME:TruckBAN — France" public/countries/France.ics
          grep -q "X-WR-CALNAME:TruckBAN — Germany" public/countries/Germany.ics
          grep -q "X-WR-CALNAME:TruckBAN — Italy" public/countries/Italy.ics
          grep -q "X-WR-CALNAME:TruckBAN — Czech Republic" public/countries/Czech_Republic.ics
          grep -q "X-WR-CALNAME:TruckBAN — Belgium" public/countries/Belgium.ics
          grep -q "X-WR-CALNAME:TruckBAN — Luxembourg" public/countries/Luxembourg.ics
          grep -q "X-WR-CALNAME:TruckBAN — Poland" public/countries/Poland.ics
          grep -q "X-WR-CALNAME:TruckBAN — Portugal" public/countries/Portugal.ics
          grep -q "X-WR-CALNAME:TruckBAN — Romania" public/countries/Romania.ics
          grep -q "X-WR-CALNAME:TruckBAN — Serbia" public/countries/Serbia.ics
          grep -q "X-WR-CALNAME:TruckBAN — Spain" public/countries/Spain.ics
          grep -q "X-WR-CALNAME:TruckBAN — Bulgaria" public/countries/Bulgaria.ics
          grep -q "X-WR-CALNAME:TruckBAN — Croatia" public/countries/Croatia.ics
          grep -q "X-WR-CALNAME:TruckBAN — Slovenia" public/countries/Slovenia.ics
          ! grep -q "BEGIN:VEVENT" public/countries/Serbia.ics
          ! grep -q "Serbia — HGV ban" public/countries/Serbia.ics
          grep -q "Ponte 25 de Abril" public/countries/Portugal.ics
          grep -q "Gardunha Tunnel" public/countries/Portugal.ics
          grep -q "Porto VCI" public/countries/Portugal.ics
          grep -q "orange ADR panel" public/countries/Portugal.ics
          ! grep -q ">7.5t dangerous-goods vehicles" public/countries/Portugal.ics
          # Portugal's unresolved 15 September timestamp is intentionally not
          # a build blocker while Bulgaria is developed independently. The
          # generated Portugal feed is still preserved and diagnosed above.
          grep -q "A2" public/countries/Romania.ics
          grep -q "DN7" public/countries/Romania.ics
          grep -q "DN39" public/countries/Romania.ics
          grep -q "DN22C" public/countries/Romania.ics
          grep -q "T090000Z" public/countries/Romania.ics
          grep -q "T030000Z" public/countries/Romania.ics
          grep -q "T150000Z" public/countries/Romania.ics
          grep -q "Czech Republic" public/countries/Czech_Republic.ics
          grep -q "7.5t" public/countries/Czech_Republic.ics
          grep -q "DTSTART:20270702T150000Z" public/countries/Czech_Republic.ics
          grep -q "DTEND:20270702T190000Z" public/countries/Czech_Republic.ics
          grep -q "DTSTART:20270703T050000Z" public/countries/Czech_Republic.ics
          grep -q "DTEND:20270703T110000Z" public/countries/Czech_Republic.ics
          grep -q "DTSTART:20270704T110000Z" public/countries/Czech_Republic.ics
          grep -q "DTEND:20270704T200000Z" public/countries/Czech_Republic.ics
          grep -q "20260904" public/countries/Bulgaria.ics
          grep -q "20260905" public/countries/Bulgaria.ics
          grep -q "20260907" public/countries/Bulgaria.ics
          grep -q "20260918" public/countries/Bulgaria.ics
          grep -q "20260922" public/countries/Bulgaria.ics
          grep -q "20261223" public/countries/Bulgaria.ics
          grep -q "20261224" public/countries/Bulgaria.ics
          grep -q "20261228" public/countries/Bulgaria.ics
          # Croatia feed starts from today, so do not validate past events.
          grep -q "20260913" public/countries/Croatia.ics
          grep -q "HGV ban — summer Sunday" public/countries/Croatia.ics
          grep -q "7.5t" public/countries/Croatia.ics
          # Slovenia: verify the 2026 tourist-season Saturday windows and
          # Good Friday rule in UTC (local Slovenia time is UTC+2 in summer).
          # General Saturday: 08:00-13:00 local = 06:00-11:00 UTC.
          grep -q "DTSTART:20260822T060000Z" public/countries/Slovenia.ics
          grep -q "DTEND:20260822T110000Z" public/countries/Slovenia.ics
          # Listed routes: 06:00-16:00 local = 04:00-14:00 UTC.
          grep -q "DTSTART:20260822T040000Z" public/countries/Slovenia.ics
          grep -q "DTEND:20260822T140000Z" public/countries/Slovenia.ics
          grep -q "HGV ban — Good Friday" public/countries/Slovenia.ics
          ! grep -R -q "DTSTART;TZID=" public --include='*.ics'
          ! grep -R -q "DTEND;TZID=" public --include='*.ics'
      - name: Upload TruckBAN diagnostic data
        uses: actions/upload-artifact@v4
        with:
          name: truckban-diagnostic-data
          path: debug/truckban
      - name: Upload calendar
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
