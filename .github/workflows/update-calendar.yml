name: Update TruckBAN Calendar

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check holidays
      - name: Generate calendar
        run: python src/calendar_generator.py
      - name: Make ICS compatible with Classic Outlook
        run: python src/outlook_ics_compat.py
      - name: Validate calendar
        run: |
          test -s public/truckban.ics
          grep -q "BEGIN:VCALENDAR" public/truckban.ics
          grep -q "END:VCALENDAR" public/truckban.ics
          ! grep -q "DTSTART;TZID=" public/truckban.ics
          ! grep -q "DTEND;TZID=" public/truckban.ics
      - name: Upload TruckBAN diagnostic data
        uses: actions/upload-artifact@v4
        with:
          name: truckban-diagnostic-data
          path: debug/truckban
      - name: Upload calendar
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
