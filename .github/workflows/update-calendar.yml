name: Update TruckBAN Calendar
# Trigger rebuild after fixing the Spain route/date-specific rules patch.

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check holidays
      - name: Fix calendar generator runtime clock
        run: |
          sed -i 's/if b <= NOW: return/if b <= datetime.now(timezone.utc): return/' src/calendar_generator.py
      - name: Apply verified France priority rules
        run: python src/priority_rules_patch.py
      - name: Apply verified country-specific rules
        run: python src/country_rules_patch.py
      - name: Apply verified Portugal rules
        run: python src/portugal_rules_patch.py
      - name: Apply Spain country baseline
        run: python src/spain_rules_patch.py
      - name: Apply Spain N-230 Sunday rule
        run: python src/spain_n230_sunday_patch.py
      - name: Generate calendar
        run: python src/calendar_generator.py
      - name: Generate country feeds
        run: python src/country_feeds.py
      - name: Make ICS feeds compatible with Classic Outlook
        run: python src/outlook_ics_compat.py
      - name: Validate Poland feed
        run: python src/validate_poland_feed.py
      - name: Validate calendar feeds
        run: |
          test -s public/truckban.ics
          grep -q "BEGIN:VCALENDAR" public/truckban.ics
          grep -q "END:VCALENDAR" public/truckban.ics
          test -s public/countries/France.ics
          test -s public/countries/Germany.ics
          test -s public/countries/Italy.ics
          test -s public/countries/Czech_Republic.ics
          test -s public/countries/Belgium.ics
          test -s public/countries/Luxembourg.ics
          test -s public/countries/Poland.ics
          test -s public/countries/Portugal.ics
          test -s public/countries/Romania.ics
          test -s public/countries/Spain.ics
          grep -q "X-WR-CALNAME:TruckBAN — France" public/countries/France.ics
          grep -q "X-WR-CALNAME:TruckBAN — Germany" public/countries/Germany.ics
          grep -q "X-WR-CALNAME:TruckBAN — Italy" public/countries/Italy.ics
          grep -q "X-WR-CALNAME:TruckBAN — Czech Republic" public/countries/Czech_Republic.ics
          grep -q "X-WR-CALNAME:TruckBAN — Belgium" public/countries/Belgium.ics
          grep -q "X-WR-CALNAME:TruckBAN — Luxembourg" public/countries/Luxembourg.ics
          grep -q "X-WR-CALNAME:TruckBAN — Poland" public/countries/Poland.ics
          grep -q "X-WR-CALNAME:TruckBAN — Portugal" public/countries/Portugal.ics
          grep -q "X-WR-CALNAME:TruckBAN — Romania" public/countries/Romania.ics
          grep -q "X-WR-CALNAME:TruckBAN — Spain" public/countries/Spain.ics
          grep -q "25 de Abril Bridge" public/countries/Portugal.ics
          grep -q "Gardunha Tunnel" public/countries/Portugal.ics
          grep -q "Porto VCI" public/countries/Portugal.ics
          # Portugal ADR scope: non-tanker restrictions are for heavy dangerous-goods
          # vehicles required to display an orange ADR panel, not a blanket >7.5t rule.
          grep -q "orange ADR panel" public/countries/Portugal.ics
          ! grep -q ">7.5t dangerous-goods vehicles" public/countries/Portugal.ics
          # The Porto VCI rule is local Portugal time converted to UTC for publication:
          # 07:00-21:00 WEST on 15 September 2026 becomes 06:00-20:00Z.
          grep -q "DTSTART:20260915T060000Z" public/countries/Portugal.ics
          grep -q "DTEND:20260915T200000Z" public/countries/Portugal.ics
          # Gardunha is generated for every local Portugal calendar date.
          # On the autumn DST changeover, midnight local converts to 23:00Z
          # on the previous UTC date and the event spans 25 UTC hours. These
          # assertions prevent a false 'missing date' regression in UTC audits.
          grep -q "DTSTART:20261024T230000Z" public/countries/Portugal.ics
          grep -q "DTEND:20261026T000000Z" public/countries/Portugal.ics
          grep -q "DTSTART:20271030T230000Z" public/countries/Portugal.ics
          grep -q "DTEND:20271101T000000Z" public/countries/Portugal.ics
          grep -q "A2" public/countries/Romania.ics
          grep -q "DN7" public/countries/Romania.ics
          grep -q "DN39" public/countries/Romania.ics
          grep -q "DN22C" public/countries/Romania.ics
          # Romania feed is converted to UTC for Classic Outlook compatibility:
          # 12:00 EEST -> 09:00Z, 06:00 EEST -> 03:00Z, 18:00 EEST -> 15:00Z.
          grep -q "T090000Z" public/countries/Romania.ics
          grep -q "T030000Z" public/countries/Romania.ics
          grep -q "T150000Z" public/countries/Romania.ics
          grep -q "Czech Republic" public/countries/Czech_Republic.ics
          grep -q "7.5t" public/countries/Czech_Republic.ics
          grep -q "17:00" public/countries/Czech_Republic.ics
          grep -q "07:00" public/countries/Czech_Republic.ics
          grep -q "13:00" public/countries/Czech_Republic.ics
          ! grep -R -q "DTSTART;TZID=" public --include='*.ics'
          ! grep -R -q "DTEND;TZID=" public --include='*.ics'
      - name: Upload TruckBAN diagnostic data
        uses: actions/upload-artifact@v4
        with:
          name: truckban-diagnostic-data
          path: debug/truckban
      - name: Upload calendar
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
